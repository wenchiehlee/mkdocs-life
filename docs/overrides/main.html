{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <link rel="stylesheet" href="{{ 'assets/stylesheets/custom.00c04c01.min.css' | url }}">
{% endblock %}

{% block announce %}
  <!-- 靈鹿 (Scandinavian Forest Deer) SVG Symbol 定義 -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
    <symbol id="icon-deer-life" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 3c0 2 1 3 4 3c2 0 3 1 3 3" />
      <path d="M21 3c0 2-1 3-4 3c-2 0-3 .3-3 3" />
      <path d="M7 3c0 1.3.3 2.3 1 3" />
      <path d="M17 3c0 1.3-.3 2.3-1 3" />

      <path d="M8 10.5l-2-1.5" />
      <path d="M16 10.5l2-1.5" />
      <path d="M10 13v.01" />
      <path d="M14 13v.01" />
      <path d="M12 16.5h.01" />
    </symbol>
  </svg>

  <div class="life-top-nav-bar">
    <div class="life-mascot-badge">
      <svg class="life-mascot-icon"><use href="#icon-deer-life"/></svg>
      <span>mkdocs-life · 靈鹿生活日誌</span>
    </div>
    <div style="display: flex; gap: 0.5rem; align-items: center;">
      <a href="https://wenchiehlee-money.github.io/UX-Deck/" class="life-nav-pill" title="回到主題首頁">
        <span>🏠</span> 主題首頁

        <span>📦</span> GitHub 儲存庫
      </a>
    </div>
  </div>
{% endblock %}

{% block scripts %}
  {{ super() }}
  <script src="{{ 'assets/javascripts/custom.9458f965.min.js' | url }}"></script>
{% endblock %}
